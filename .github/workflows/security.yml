name: Privacy and security checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run check:edge
      - run: npm run check:telemetry
      - run: npm run check:search
      - run: npm run check:security
      - run: npm run check:security:history
      - run: npm run check:security:regressions
      - run: npm audit --audit-level=low
